databaseChangeLog:
  - changeSet:
      id: 004-create-item
      author: sandrina
      changes:
        - createTable:
            tableName: items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: reservation_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_item_reservation
                    references: reservations(id)
              - column:
                  name: item_type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false



