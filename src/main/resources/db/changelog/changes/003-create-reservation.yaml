databaseChangeLog:
  - changeSet:
      id: 003-create-reservation
      author: sandrina
      changes:
        - createTable:
            tableName: reservations
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: start_time
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: pay_status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: qr_code
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_reservations_qr_code
              - column:
                  name: client_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_reservations_user
                    referencedTableName: users
                    referencedColumnNames: id
              - column:
                  name: location_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_reservations_storage_location
                    referencedTableName: storage_location
                    referencedColumnNames: id
        - createIndex:
            tableName: reservations
            indexName: idx_reservations_location_period
            columns:
              - column:
                  name: location_id
              - column:
                  name: start_time
              - column:
                  name: end_time